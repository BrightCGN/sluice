[project]
name = "sluice"
version = "0.1.0"
description = "Die eine gemeinsame Sanitisierungs-Boundary: Profil-Gate → Strategie → Verifier → Audit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "structlog>=24.0",
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sluice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
